<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學測國文刷題</title>
<style>
:root{color-scheme:light dark;--bg:#fafaf7;--fg:#222;--card:#fff;--bd:#d8d8d0;--ok:#1b8a4b;--no:#c0392b;--ac:#2d5fd0}
@media(prefers-color-scheme:dark){:root{--bg:#181a1b;--fg:#e8e6e1;--card:#232628;--bd:#3a3f42;--ok:#4cc783;--no:#ef6f61;--ac:#7aa2ff}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.7 system-ui,"Noto Sans TC",sans-serif}
main{max-width:640px;margin:auto;padding:16px}
button,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin:4px 0}
.opt{display:block;width:100%;text-align:left}
.sel{border-color:var(--ac);outline:2px solid var(--ac)}.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--card))}
.go{background:var(--ac);color:#fff;border:0}.meta{opacity:.7;font-size:14px}
</style></head><body><main id="app">載入中…</main>
<script>
// 若要同步到 Google Sheet，把 Apps Script 網頁應用程式網址貼在這裡（留空＝只存本機）
const SYNC_URL="";
let Q=[],list=[],i=0,picks=new Set(),done=false;
const A=document.getElementById("app");
const id=q=>q.y+"-"+q.n;
const S=()=>{try{return JSON.parse(localStorage.getItem("qb"))||{w:{},c:0,t:0}}catch(e){return{w:{},c:0,t:0}}};
const save=s=>{try{localStorage.setItem("qb",JSON.stringify(s))}catch(e){}};
const L="ABCDE";
Promise.all(["questions.json","q2.json","q3.json","q4.json","q5.json","q6.json","q7.json","q8.json","q9.json","q10.json"].map(f=>fetch(f).then(r=>r.ok?r.json():[]).catch(()=>[]))).then(a=>{Q=a.flat();if(!Q.length)throw 0;home()}).catch(()=>A.textContent="讀不到 questions.json（請用 GitHub Pages 開啟）");
function home(){const s=S(),ys=[...new Set(Q.map(q=>q.y))];
A.innerHTML=`<h2>學測國文刷題</h2><p class="meta">題庫 ${Q.length} 題｜累計作答 ${s.t}，答對 ${s.c}（${s.t?Math.round(s.c/s.t*100):0}%）｜錯題 ${Object.keys(s.w).length}</p>
<button class="go" onclick="start('all')">隨機刷題</button><br>
<select id="yr">${ys.map(y=>`<option value="${y}">${y} 年</option>`)}</select> <button onclick="start('y',yr.value)">依年度</button><br>
<button onclick="start('w')">只刷錯題</button> <button onclick="if(confirm('清除紀錄？')){save({w:{},c:0,t:0});home()}">清除紀錄</button>`}
function start(m,v){const s=S();list=Q.filter(q=>m=="all"||(m=="y"&&q.y==v)||(m=="w"&&s.w[id(q)]));
if(!list.length){alert("沒有題目");return}
list.sort(()=>Math.random()-.5);i=0;show()}
function show(){const q=list[i];picks=new Set();done=false;
A.innerHTML=`<p class="meta">${i+1}/${list.length}｜${q.y} 學測 第${q.n}題${q.a.length>1?"（多選）":""} <button onclick="home()">結束</button></p><p>${q.q}</p>`+
q.o.map((t,k)=>`<button class="opt" id="o${k}" onclick="pick(${k})">(${L[k]}) ${t}</button>`).join("")+`<div id="f"><button class="go" onclick="submit()">送出</button></div>`}
function pick(k){if(done)return;const q=list[i];
if(q.a.length==1){picks=new Set([k]);submit();return}
picks.has(k)?picks.delete(k):picks.add(k);document.getElementById("o"+k).classList.toggle("sel")}
function submit(){if(done||!picks.size)return;done=true;const q=list[i],p=[...picks].sort().map(k=>L[k]).join(""),ok=p==q.a,s=S();
s.t++;if(ok){s.c++;delete s.w[id(q)]}else s.w[id(q)]=1;save(s);
q.o.forEach((_,k)=>{const b=document.getElementById("o"+k);b.classList.remove("sel");
if(q.a.includes(L[k]))b.classList.add("ok");else if(picks.has(k))b.classList.add("no")});
document.getElementById("f").innerHTML=`<p>${ok?"✅ 答對":"❌ 答錯"}，正確答案：${q.a}</p><button class="go" onclick="next()">${i+1<list.length?"下一題":"完成"}</button>`;
if(SYNC_URL)fetch(SYNC_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({user:localStorage.getItem("uid")||(localStorage.uid=Math.random().toString(36).slice(2)),id:id(q),ok:ok,pick:p})}).catch(()=>{})}
function next(){i++;i<list.length?show():home()}
</script></body></html>
